name: Apply release snapshot

on:
  push:
    paths:
      - .github/zepp-release.patch.gz.b64.part*

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify patch
        run: |
          cat .github/zepp-release.patch.gz.b64.part* | base64 -d | gunzip > /tmp/zepp-release.patch
          echo '2581c29a2a070a965f6ef87229c4d9bc84c1580fd614c579a34680e9aa66f270  /tmp/zepp-release.patch' | sha256sum -c -
          git apply --check /tmp/zepp-release.patch
      - name: Apply release snapshot
        run: |
          git apply /tmp/zepp-release.patch
          rm -f .github/zepp-release.patch.gz.b64.part* .github/workflows/apply-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete Zepp Cloud MCP server'
          git push origin HEAD:main
