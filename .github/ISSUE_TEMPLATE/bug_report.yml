name: Bug report
description: Something is broken or returns wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste tokens, secrets, user IDs, or real health data.** Security issues go to the private advisory form (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Tool name and arguments, or the dashboard page. }
    validations: { required: true }
  - type: dropdown
    id: target
    attributes: { label: Deployment, options: [Node server, Cloudflare Worker] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
  - type: input
    id: device
    attributes: { label: Watch model and Zepp region host (e.g. Balance 2, us3) }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs (redacted), render: text }
