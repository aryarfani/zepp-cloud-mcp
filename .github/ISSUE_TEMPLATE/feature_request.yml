name: Feature request
description: Suggest a new metric, tool, or dashboard view
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution, description: For new metrics, which Zepp endpoint or event stream provides it (redacted sample shape welcome). }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
